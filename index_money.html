:root{
  --bg:#FEFDFC; --card:#FFFFFF; --ink:#404040; --muted:#6E7B87;
  --blue:#0069D3; --blue-hover:#005BB8; --blue-tint:#EEF5FD; --blue-soft:#BFD8F3;
  --orange:#E8912D; --orange-tint:#FDF3E8;
  --line:#E4E7EB; --line-strong:#CDD4DB; --bar:#C5CED6;
  --r:12px;
  --font:Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.5 var(--font); font-feature-settings:"kern"; -webkit-font-smoothing:antialiased}
button{font:inherit}
.hidden{display:none !important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.app{max-width:680px; margin:0 auto; padding:24px 16px 40px; min-height:100vh; min-height:100dvh}

.brand{font-weight:600; font-size:14px; letter-spacing:.01em; color:var(--blue); margin:0}
.title{font-weight:600; font-size:clamp(32px,8vw,46px); line-height:1.08; letter-spacing:-.025em; margin:10px 0 16px}
.lead{font-size:18px; line-height:1.5; margin:0 0 28px; max-width:32em}
.source{font-size:13px; line-height:1.45; color:var(--muted); margin:36px 0 0; padding-top:14px; border-top:1px solid var(--line)}
.source a{color:inherit; text-decoration:underline; text-decoration-color:rgba(110,123,135,.45); text-underline-offset:2px}
.source a:hover{color:var(--blue)}

.btn{appearance:none; -webkit-appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:12px 22px; border-radius:10px; border:1.5px solid var(--blue); background:var(--card); color:var(--blue); font:500 16px/1.2 var(--font); text-decoration:none; cursor:pointer; transition:background .15s, color .15s, border-color .15s, transform .1s}
.btn:hover{background:var(--blue-tint)}
.btn.primary{background:var(--blue); color:#fff}
.btn.primary:hover{background:var(--blue-hover); border-color:var(--blue-hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:#E9EDF1; border-color:#E9EDF1; color:#8A95A0; cursor:not-allowed; transform:none}
.btn.small{min-height:42px; padding:8px 16px; font-size:15px}
.btn[aria-expanded="true"]{background:var(--blue-hover); border-color:var(--blue-hover)}
:focus-visible{outline:3px solid rgba(0,105,211,.4); outline-offset:2px}
[tabindex="-1"]:focus{outline:none}

/* top bar */
.top{position:sticky; top:0; z-index:5; background:var(--bg); margin:-24px -16px 0; padding:14px 16px 12px}
.top-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:10px}
.count{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.progress{display:grid; grid-template-columns:repeat(var(--n,10),1fr); gap:4px}
.progress i{height:4px; border-radius:2px; background:var(--line); transition:background .3s}
.progress i.cur{background:#98A3AE}
.progress i.ok{background:var(--blue)}
.progress i.bad{background:var(--orange)}

/* question */
.q-body{animation:rise .35s ease both}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.prompt{font-weight:600; font-size:clamp(20px,5.2vw,24px); line-height:1.3; letter-spacing:-.01em; margin:22px 0 0}
.note{font-size:14px; line-height:1.45; color:var(--muted); margin:8px 0 0}
.hint{font-size:14px; line-height:1.45; color:var(--muted); margin:8px 0 0}

.options{display:grid; gap:10px; margin-top:20px}
.opt{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:54px; padding:13px 14px 13px 16px; text-align:left; border-radius:var(--r); border:1.5px solid var(--line-strong); background:var(--card); color:var(--ink); font:400 16px/1.4 var(--font); cursor:pointer; transition:border-color .15s, background .15s, opacity .25s}
.opt:hover:not([aria-disabled="true"]){border-color:var(--blue)}
.opt[aria-disabled="true"]{cursor:default}
.opt.is-correct{border-color:var(--blue); background:var(--blue-tint)}
.opt.is-wrong{border-color:var(--orange); background:var(--orange-tint)}
.opt.is-dim{opacity:.5}
.mark{flex:0 0 24px; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:#fff}
.mark:empty{visibility:hidden}
.is-correct .mark, .mark.ok{background:var(--blue)}
.is-wrong .mark, .mark.bad{background:var(--orange)}

/* months */
.months{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:20px}
@media (min-width:520px){.months{grid-template-columns:repeat(4,1fr)}}
.month{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:62px; padding:8px 4px; border-radius:10px; border:1.5px solid var(--line-strong); background:var(--card); color:var(--ink); font:400 15px/1.2 var(--font); cursor:pointer; transition:border-color .15s, background .15s, opacity .25s}
.month:hover:not([aria-disabled="true"]){border-color:var(--blue)}
.month[aria-disabled="true"]{cursor:default}
.m-val{font-weight:600; font-size:14px; line-height:1.2; font-variant-numeric:tabular-nums}
.m-val:empty{display:none}
.month.is-correct{border-color:var(--blue); background:var(--blue-tint)}
.month.is-wrong{border-color:var(--orange); background:var(--orange-tint)}
.month.is-dim{opacity:.45}
.month .mark{position:absolute; top:-8px; right:-8px; width:22px; height:22px; flex:none; box-shadow:0 0 0 2px var(--bg)}
.month .mark svg{width:13px; height:13px}

/* matching */
.match{margin-top:18px}
.pool{display:flex; flex-wrap:wrap; gap:8px; min-height:56px; padding:6px; margin:0 -6px 12px; border-radius:var(--r); transition:background .15s}
.pool.is-over{background:var(--blue-tint)}
.chip{appearance:none; -webkit-appearance:none; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; display:inline-flex; align-items:center; min-height:42px; margin:0; padding:9px 14px; border-radius:999px; border:1.5px solid var(--blue); background:var(--card); color:var(--blue); font:500 16px/1.2 var(--font); cursor:grab; box-shadow:0 1px 2px rgba(20,30,40,.06); transition:background .15s, color .15s, opacity .15s}
.chip:hover{background:var(--blue-tint)}
.chip.is-selected{background:var(--blue); color:#fff}
.chip.is-dragging{opacity:.3}
.chip:disabled{cursor:default; opacity:1}
.ghost{position:fixed; left:0; top:0; z-index:50; pointer-events:none; cursor:grabbing; box-shadow:0 10px 26px rgba(20,30,40,.2); background:var(--card)}
.defs{display:grid; gap:10px}
.def{position:relative; display:grid; grid-template-columns:1fr; gap:10px; padding:12px 14px; border-radius:var(--r); border:1.5px dashed var(--line-strong); background:var(--card); cursor:pointer; user-select:none; -webkit-user-select:none; transition:border-color .15s, background .15s}
@media (min-width:480px){.def{grid-template-columns:150px 1fr; align-items:center}}
.def.is-filled{border-style:solid}
.match.has-selection .def{border-color:var(--blue)}
.def.is-over{border-style:solid; border-color:var(--blue); background:var(--blue-tint)}
.def.is-locked{cursor:default; padding-right:46px}
.def.is-correct{border:2px solid var(--blue); background:var(--blue-tint)}
.def.is-wrong{border:2px solid var(--orange); background:var(--orange-tint)}
.def > .mark{position:absolute; top:12px; right:12px}
.slot{display:flex; align-items:center; min-height:42px}
.slot-ph{display:inline-flex; align-items:center; min-height:42px; padding:9px 14px; border-radius:999px; border:1.5px dashed var(--line-strong); color:var(--muted); font-size:15px; line-height:1.2}
.def.is-filled .slot-ph{display:none}
.def-text{margin:0; font-size:16px; line-height:1.4}
.def-fix{grid-column:1/-1; margin:0; font-size:14px; font-weight:500}
@media (min-width:480px){.def-fix{grid-column:2; margin-top:-4px}}
.match-actions{margin-top:16px}
.pool .cell{display:inline-flex; border-radius:999px}
.pool .cell:empty{min-height:42px; border:1.5px dashed var(--line)}
.def.is-full{animation:nudge .35s ease}
@keyframes nudge{30%{transform:translateX(-4px)} 60%{transform:translateX(4px)}}
/* long lists of options: two columns, filled top to bottom */
.options.many{grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:repeat(var(--rows,5),auto); gap:8px}
.options.many .opt{min-height:50px; padding:10px 10px 10px 14px; font-size:15px; line-height:1.3}

/* feedback */
.feedback{margin-top:20px; padding:18px 18px 20px; border-radius:var(--r); background:var(--card); border:1px solid var(--line); animation:rise .3s ease both}
.fb-head{display:flex; align-items:center; gap:10px; margin:0 0 8px; font-weight:600; font-size:20px; line-height:1.25}
.fb-head .mark{flex-basis:28px; width:28px; height:28px}
.explain{margin:0}
.chart{margin:18px 0 0; padding:0}
.chart figcaption{font-size:14px; line-height:1.4; color:var(--muted); margin:0 0 12px}
.bars{display:grid; gap:10px}
.bar-label{font-size:14px; line-height:1.3; margin:0 0 4px}
.bar-row.hl .bar-label{font-weight:600}
.bar-line{display:flex; align-items:center; gap:8px}
.bar-fill{flex:none; height:10px; min-width:3px; width:calc((100% - 56px) * var(--p,0)); border-radius:0 4px 4px 0; background:var(--bar); transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar-row.hl .bar-fill{background:var(--blue)}
.bar-val{font-size:14px; line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap}
.bar-row.hl .bar-val{font-weight:600}
.split{display:flex; gap:2px; height:34px}
.split-seg{display:flex; align-items:center; min-width:0; padding:0 10px; background:var(--blue-soft); color:var(--ink); font-weight:600; font-size:15px; font-variant-numeric:tabular-nums}
.split-seg:first-child{border-radius:4px 0 0 4px}
.split-seg:last-child{border-radius:0 4px 4px 0}
.split-seg.hl{background:var(--blue); color:#fff}
.split-legend{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:10px; font-size:14px}
.key{display:inline-flex; align-items:center; gap:7px}
.key i{width:10px; height:10px; border-radius:2px; background:var(--blue-soft)}
.key.hl i{background:var(--blue)}
.next-row{margin-top:20px}

/* end */
.eyebrow{font-size:15px; color:var(--muted); margin:28px 0 6px}
.score{font-weight:600; font-size:clamp(52px,15vw,76px); line-height:1; letter-spacing:-.035em; margin:0 0 20px}
.score small{font-size:.42em; letter-spacing:-.01em; font-weight:500; color:var(--muted)}
.dots{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 20px; padding:0; list-style:none}
.dots .mark{flex:none; width:28px; height:28px}
.verdict{font-size:18px; line-height:1.45; margin:0 0 24px; max-width:32em}
.verdict a{color:var(--blue); text-decoration:underline; text-decoration-color:rgba(0,105,211,.45); text-underline-offset:2px}
.verdict a:hover{text-decoration-color:currentColor}
.actions{display:flex; flex-wrap:wrap; gap:10px}
.share{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; padding:12px; border-radius:var(--r); background:var(--card); border:1px solid var(--line)}
.toast{position:fixed; left:50%; bottom:24px; z-index:60; max-width:calc(100% - 32px); padding:10px 16px; border-radius:10px; background:var(--ink); color:#fff; font-size:15px; opacity:0; pointer-events:none; transform:translate(-50%,16px); transition:opacity .2s, transform .2s}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}

<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('quiz-data').textContent);
const Q = D.questions, TOTAL = Q.length, U = D.ui;
const $ = s => document.querySelector(s);
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const ICONS = {
  ok: '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5 12.6l4.3 4.2L19 7.2" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad: '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7.2 7.2l9.6 9.6M16.8 7.2l-9.6 9.6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>'
};
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function setMark(node, kind){ node.innerHTML = kind ? ICONS[kind] : ''; if (kind) node.classList.add(kind); }
const fill = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);

/* ---------- static texts ---------- */
function sourceLine(p){
  p.textContent = '';
  p.append(D.source.before, h('a', { href: D.source.url, target: '_blank', rel: 'noopener' }, D.source.link), D.source.after, ' ',
    h('a', { href: D.channel.url, target: '_blank', rel: 'noopener' }, D.channel.name));
}
['#startBrand', '#quizBrand', '#endBrand'].forEach(s => $(s).textContent = D.brand);
$('#startTitle').textContent = D.title;
$('#startLead').textContent = D.lead;
$('#startBtn').textContent = U.start;
$('#resultTitle').textContent = U.resultTitle;
$('#shareBtn').textContent = U.share;
$('#againBtn').textContent = U.again;
$('#shCopy').textContent = U.copy;
$('#shMore').textContent = U.more;
const articleBtn = $('#articleBtn');
if (D.articleUrl){ articleBtn.href = D.articleUrl; articleBtn.textContent = U.article; } else articleBtn.classList.add('hidden');
sourceLine($('#startSource')); sourceLine($('#endSource'));

/* ---------- state ---------- */
let idx = 0, results = [], answered = false, ctl = null;
const stage = $('#stage');

const EMBEDDED = window.self !== window.top;
function toTop(el){
  window.scrollTo(0, 0);
  if (EMBEDDED && el) try { el.scrollIntoView({ block: 'start' }); } catch (_) {}
}
function show(id){
  ['#startScreen', '#quizScreen', '#endScreen'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  toTop($(id));
}
function drawProgress(){
  const p = $('#progress'); p.style.setProperty('--n', TOTAL); p.textContent = '';
  for (let i = 0; i < TOTAL; i++){
    const cls = i < results.length ? (results[i] ? 'ok' : 'bad') : (i === idx ? 'cur' : '');
    p.append(h('i', { class: cls }));
  }
  $('#count').textContent = fill(U.progress, { n: idx + 1, total: TOTAL });
}

function start(){
  idx = 0; results = []; setShare(false);
  show('#quizScreen'); render();
}

function render(){
  if (ctl) ctl.abort();
  ctl = new AbortController();
  answered = false;
  const q = Q[idx];
  drawProgress();
  stage.textContent = '';
  const body = h('div', { class: 'q-body' });
  const prompt = h('h2', { class: 'prompt', tabindex: '-1', id: 'prompt' }, q.prompt);
  body.append(prompt);
  if (q.note) body.append(h('p', { class: 'note' }, q.note));
  if (q.type === 'choice') renderChoice(q, body);
  else if (q.type === 'months') renderMonths(q, body);
  else if (q.type === 'match') renderMatch(q, body);
  stage.append(body);
  toTop($('#quizScreen'));
  prompt.focus({ preventScroll: true });
}

/* ---------- choice ---------- */
function renderChoice(q, body){
  const list = h('div', { class: 'options', role: 'group', 'aria-labelledby': 'prompt' });
  if (q.options.length > 6){ list.classList.add('many'); list.style.setProperty('--rows', Math.ceil(q.options.length / 2)); }
  q.options.forEach((o, i) => {
    const b = h('button', { class: 'opt', type: 'button' }, h('span', null, o.text), h('span', { class: 'mark', 'aria-hidden': 'true' }));
    b.addEventListener('click', () => {
      if (answered) return;
      const ok = !!o.correct;
      [...list.children].forEach((btn, j) => {
        btn.setAttribute('aria-disabled', 'true');
        const right = !!q.options[j].correct, mine = j === i;
        if (right){ btn.classList.add('is-correct'); setMark(btn.querySelector('.mark'), 'ok'); btn.append(h('span', { class: 'sr' }, ' (верный ответ)')); }
        else if (mine){ btn.classList.add('is-wrong'); setMark(btn.querySelector('.mark'), 'bad'); btn.append(h('span', { class: 'sr' }, ' (ваш ответ)')); }
        else btn.classList.add('is-dim');
      });
      finish(q, ok, body);
    });
    list.append(b);
  });
  body.append(list);
}

/* ---------- months ---------- */
function renderMonths(q, body){
  const grid = h('div', { class: 'months', role: 'group', 'aria-labelledby': 'prompt' });
  q.months.forEach((m, i) => {
    const b = h('button', { class: 'month', type: 'button' }, h('span', null, m), h('span', { class: 'm-val' }), h('span', { class: 'mark', 'aria-hidden': 'true' }));
    b.addEventListener('click', () => {
      if (answered) return;
      [...grid.children].forEach((btn, j) => {
        btn.setAttribute('aria-disabled', 'true');
        const v = q.values[String(j)];
        if (v) btn.querySelector('.m-val').textContent = v;
        if (j === q.correct){ btn.classList.add('is-correct'); setMark(btn.querySelector('.mark'), 'ok'); }
        else if (j === i){ btn.classList.add('is-wrong'); setMark(btn.querySelector('.mark'), 'bad'); }
        else if (!v) btn.classList.add('is-dim');
      });
      finish(q, i === q.correct, body);
    });
    grid.append(b);
  });
  body.append(grid);
}

/* ---------- matching: tap a term to put it into the first empty definition, tap a filled definition to send the term back; terms can also be dragged ---------- */
function renderMatch(q, body){
  const signal = ctl.signal;
  const wrap = h('div', { class: 'match' });
  const pool = h('div', { class: 'pool', 'aria-label': 'Термины' });
  const home = {};
  q.terms.forEach(t => {
    const cell = h('span', { class: 'cell' }, h('button', { class: 'chip', type: 'button', 'data-term': t.id }, t.label));
    home[t.id] = cell; pool.append(cell);
  });
  const defs = q.defs.map(d => h('div', { class: 'def', role: 'button', tabindex: '0', 'data-answer': d.term },
    h('div', { class: 'slot' }, h('span', { class: 'slot-ph', 'aria-hidden': 'true' }, U.slot)),
    h('p', { class: 'def-text' }, d.text)));
  const list = h('div', { class: 'defs' }, defs);
  const hint = h('p', { class: 'hint' }, q.hint);
  const check = h('button', { class: 'btn primary', type: 'button', disabled: true }, U.check);
  wrap.append(pool, list);
  body.append(hint, wrap, h('div', { class: 'match-actions' }, check));

  let drag = null, suppressClick = false, locked = false, raf = 0;
  const chipIn = def => def.querySelector('.slot .chip');
  const label = id => q.terms.find(t => t.id === id).label;
  function toPool(chip){ home[chip.dataset.term].append(chip); }
  function place(chip, def){
    const other = chipIn(def);
    if (other === chip) return;
    const from = chip.closest('.def');
    if (!from){ const cell = home[chip.dataset.term]; cell.style.minWidth = chip.offsetWidth + 'px'; }
    if (other){ if (from) from.querySelector('.slot').append(other); else toPool(other); }
    def.querySelector('.slot').append(chip);
    refresh();
  }
  function refresh(){
    defs.forEach(d => {
      const c = chipIn(d);
      d.classList.toggle('is-filled', !!c);
      d.setAttribute('aria-label', (c ? c.textContent + ': ' : 'Пусто: ') + d.querySelector('.def-text').textContent);
    });
    check.disabled = !defs.every(chipIn);
  }
  function nudge(){ defs.forEach(d => { d.classList.remove('is-full'); void d.offsetWidth; d.classList.add('is-full'); d.addEventListener('animationend', () => d.classList.remove('is-full'), { once: true }); }); }
  refresh();

  // tap / click / keyboard
  wrap.addEventListener('click', e => {
    if (locked) return;
    if (suppressClick){ suppressClick = false; return; }
    const def = e.target.closest('.def');
    if (def){ const c = chipIn(def); if (c){ toPool(c); refresh(); } return; }
    const chip = e.target.closest('.chip');
    if (chip){ const free = defs.find(d => !chipIn(d)); if (free) place(chip, free); else nudge(); }
  }, { signal });
  defs.forEach(d => d.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); d.click(); }
  }, { signal }));

  // drag (mouse, touch and pen through pointer events)
  function hit(x, y){ const t = document.elementFromPoint(x, y); return t ? t.closest('.def') : null; }
  function setOver(target){
    if (drag.over === target) return;
    if (drag.over) drag.over.classList.remove('is-over');
    drag.over = target;
    if (target) target.classList.add('is-over');
  }
  function autoScroll(){
    if (!drag || !drag.active) return;
    const edge = 56, y = drag.y, top = drag.barBottom, r = wrap.getBoundingClientRect();
    let dy = 0;
    if (y < top + edge && r.top < top + 8) dy = -Math.ceil((top + edge - y) / 5);
    else if (y > innerHeight - edge && r.bottom > innerHeight - 8) dy = Math.ceil((y - innerHeight + edge) / 5);
    if (dy){ window.scrollBy(0, dy); setOver(hit(drag.x, drag.y)); }
    raf = requestAnimationFrame(autoScroll);
  }
  wrap.addEventListener('pointerdown', e => {
    const chip = e.target.closest('.chip');
    if (locked || !chip || (e.pointerType === 'mouse' && e.button !== 0)) return;
    suppressClick = false;
    drag = { chip, id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, active: false, over: null };
    try { chip.setPointerCapture(e.pointerId); } catch (_) {}
  }, { signal });
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.active){
      if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) < 6) return;
      const r = drag.chip.getBoundingClientRect();
      drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
      drag.ghost = drag.chip.cloneNode(true);
      drag.ghost.classList.add('ghost');
      drag.ghost.removeAttribute('data-term'); drag.ghost.setAttribute('aria-hidden', 'true');
      drag.ghost.style.width = r.width + 'px';
      document.body.append(drag.ghost);
      drag.chip.classList.add('is-dragging');
      drag.active = true;
      drag.barBottom = Math.max(0, $('.top').getBoundingClientRect().bottom);
      raf = requestAnimationFrame(autoScroll);
    }
    e.preventDefault();
    drag.ghost.style.transform = `translate(${drag.x - drag.dx}px, ${drag.y - drag.dy}px) scale(1.04)`;
    setOver(hit(drag.x, drag.y));
  }, { signal, passive: false });
  function endDrag(drop){
    cancelAnimationFrame(raf);
    if (!drag) return;
    if (drag.active){
      const target = drop ? drag.over : null;
      if (target) place(drag.chip, target);
      else if (drop && drag.chip.closest('.def')){ toPool(drag.chip); refresh(); }
      if (drag.over) drag.over.classList.remove('is-over');
      drag.ghost.remove(); drag.chip.classList.remove('is-dragging');
      suppressClick = true;
    }
    drag = null;
  }
  window.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) endDrag(true); }, { signal });
  window.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) endDrag(false); }, { signal });

  check.addEventListener('click', () => {
    if (locked || check.disabled) return;
    locked = true;
    let all = true;
    defs.forEach(d => {
      const c = chipIn(d), ok = !!c && c.dataset.term === d.dataset.answer;
      d.classList.add('is-locked', ok ? 'is-correct' : 'is-wrong');
      d.removeAttribute('role'); d.removeAttribute('tabindex');
      const m = h('span', { class: 'mark', 'aria-hidden': 'true' }); setMark(m, ok ? 'ok' : 'bad'); d.append(m);
      if (!ok){
        all = false;
        d.querySelector('.def-text').after(h('p', { class: 'def-fix' }, U.matchFix + label(d.dataset.answer)));
      }
      d.setAttribute('aria-label', (ok ? 'Верно. ' : 'Неверно. ') + d.textContent);
    });
    wrap.querySelectorAll('.chip').forEach(c => { c.disabled = true; });
    check.parentElement.remove();
    hint.remove();
    pool.remove(); // all terms are placed by now; the empty tray would only leave a gap
    finish(q, all, body);
  }, { signal });
}

/* ---------- feedback ---------- */
function chart(ch){
  const fig = h('figure', { class: 'chart' }, h('figcaption', null, ch.title));
  if (ch.type === 'bars'){
    const max = Math.max(...ch.rows.map(r => r.value));
    const rows = ch.rows.map(r => {
      const bar = h('span', { class: 'bar-fill' });
      bar.dataset.p = r.value / max;
      return h('div', { class: 'bar-row' + (r.hl ? ' hl' : '') },
        h('div', { class: 'bar-label' }, r.label),
        h('div', { class: 'bar-line' }, bar, h('span', { class: 'bar-val' }, r.display)));
    });
    fig.append(h('div', { class: 'bars' }, rows));
  } else if (ch.type === 'split'){
    fig.append(h('div', { class: 'split', role: 'img', 'aria-label': ch.parts.map(p => p.label + ': ' + p.display).join(', ') },
      ch.parts.map(p => h('span', { class: 'split-seg' + (p.hl ? ' hl' : ''), style: 'flex:' + p.value + ' 1 0' }, p.display))));
    fig.append(h('div', { class: 'split-legend', 'aria-hidden': 'true' }, ch.parts.map(p => h('span', { class: 'key' + (p.hl ? ' hl' : '') }, h('i'), p.label))));
  }
  return fig;
}

function finish(q, ok, body){
  answered = true;
  results[idx] = ok;
  drawProgress();
  const last = idx === TOTAL - 1;
  const mark = h('span', { class: 'mark', 'aria-hidden': 'true' }); setMark(mark, ok ? 'ok' : 'bad');
  const head = h('p', { class: 'fb-head', tabindex: '-1' }, mark, ok ? U.correct : U.wrong);
  const next = h('button', { class: 'btn primary', type: 'button' }, last ? U.finish : U.next);
  next.addEventListener('click', () => { idx++; if (idx < TOTAL) render(); else end(); });
  const fb = h('div', { class: 'feedback ' + (ok ? 'ok' : 'bad'), role: 'region', 'aria-label': ok ? U.correct : U.wrong },
    head, h('p', { class: 'explain' }, q.explain), q.chart ? chart(q.chart) : null, h('div', { class: 'next-row' }, next));
  body.append(fb);
  // grow the bars after they are in the layout
  const bars = fb.querySelectorAll('.bar-fill');
  const grow = () => bars.forEach(b => b.style.setProperty('--p', b.dataset.p));
  if (REDUCED) grow(); else requestAnimationFrame(() => requestAnimationFrame(grow));
  head.focus({ preventScroll: true });
  // bring the explanation into view: its bottom if it fits, otherwise its top (below the sticky bar)
  const r = fb.getBoundingClientRect(), barH = $('.top').offsetHeight + 8;
  if (EMBEDDED){ try { fb.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); } catch (_) {} }
  else if (r.bottom > innerHeight || r.top < barH){
    const dy = Math.min(r.top - barH, r.bottom - innerHeight + 16);
    window.scrollBy({ top: Math.max(dy, -window.scrollY), behavior: REDUCED ? 'auto' : 'smooth' });
  }
}

/* ---------- end ---------- */
function end(){
  if (ctl) ctl.abort();
  const score = results.filter(Boolean).length;
  const sl = $('#scoreLine'); sl.textContent = '';
  sl.append(String(score), h('small', null, ' ' + fill(U.score, { score: '', total: TOTAL }).trim()));
  sl.setAttribute('aria-label', fill(U.score, { score, total: TOTAL }));
  const dots = $('#dots'); dots.textContent = '';
  results.forEach((ok, i) => {
    const m = h('span', { class: 'mark' }); setMark(m, ok ? 'ok' : 'bad');
    dots.append(h('li', { title: (i + 1) + ': ' + (ok ? 'верно' : 'неверно') }, m, h('span', { class: 'sr' }, (i + 1) + ' ' + (ok ? 'верно' : 'неверно'))));
  });
  const v = D.verdicts.find(v => score >= v.min), vEl = $('#verdict');
  vEl.textContent = '';
  if (v.link && v.text.includes(v.link.text)){
    const parts = v.text.split(v.link.text);
    vEl.append(parts.shift(), h('a', { href: v.link.url, target: '_blank', rel: 'noopener' }, v.link.text), parts.join(v.link.text));
  } else vEl.textContent = v.text;
  setShare(false);
  show('#endScreen');
  sl.focus({ preventScroll: true });
}

/* ---------- share: own menu (the system sheet on a PC offers odd apps and no Telegram) ---------- */
const shareMenu = $('#shareMenu'), shareBtn = $('#shareBtn');
const shareUrl = () => /^https?:/.test(location.href) ? location.href.split('#')[0] : (D.articleUrl || D.channel.url);
const plain = s => s.replace(/\u00a0/g, ' ').replace(/\u2011/g, '-');
const shareLine = () => plain(fill(U.shareText, { score: results.filter(Boolean).length, total: TOTAL }));
function setShare(open){ shareMenu.classList.toggle('hidden', !open); shareBtn.setAttribute('aria-expanded', String(open)); }
let toastTimer = 0;
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2200); }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast(U.copied); return; } catch (_) {}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed; top:0; left:0; opacity:0';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();
  toast(ok ? U.copied : text, ok ? 2200 : 7000);
}
shareBtn.addEventListener('click', () => {
  const open = shareMenu.classList.contains('hidden');
  if (open){
    const url = encodeURIComponent(shareUrl()), line = encodeURIComponent(shareLine());
    $('#shTg').href = `https://t.me/share/url?url=${url}&text=${line}`;
    $('#shVk').href = `https://vk.com/share.php?url=${url}&title=${line}`;
  }
  setShare(open);
});
$('#shCopy').addEventListener('click', () => copyText(shareLine() + ' ' + shareUrl()));
if (navigator.share && window.matchMedia && window.matchMedia('(pointer: coarse)').matches){
  const more = $('#shMore'); more.classList.remove('hidden');
  more.addEventListener('click', async () => { try { await navigator.share({ text: shareLine(), url: shareUrl() }); } catch (_) {} });
}
$('#startBtn').addEventListener('click', start);
$('#againBtn').addEventListener('click', start);
})();
</script>
</body>
